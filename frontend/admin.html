<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin HQ | Voxa</title>
    <link rel="icon" type="image/png" href="images/voxa-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      .dashboard-header {
        background: var(--bg-card);
        padding: 20px 30px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .admin-card {
        background: var(--bg-card);
        padding: 25px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 30px;
      }

      /* KPI Grid Styling */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }
      .kpi-box {
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }
      .kpi-value {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--primary-color);
        margin: 10px 0;
      }
      .kpi-label {
        color: var(--text-muted);
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-outline {
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
      }
      .btn-outline:hover {
        border-color: #ef4444;
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        color: white;
        border-radius: 6px;
        margin-top: 5px;
        margin-bottom: 15px;
        font-family: inherit;
      }
      .btn-primary {
        width: 100%;
        padding: 12px;
        border: none;
        background: var(--primary-color);
        color: #000;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-primary:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body style="background: var(--bg-main); color: var(--text-main)">
    <div class="dashboard-header">
      <div>
        <h2 id="welcomeMsg">SuperAdmin HQ</h2>
        <p style="color: var(--primary-color); font-weight: 600">
          <i class="fas fa-shield-alt"></i> System God Mode
        </p>
      </div>
      <button onclick="logout()" class="btn-outline">Logout</button>
    </div>

    <div class="container">
      <div class="kpi-grid">
        <div class="kpi-box">
          <i
            class="fas fa-building"
            style="font-size: 1.5rem; color: var(--text-muted)"></i>
          <div class="kpi-value" id="kpi-agencies">-</div>
          <div class="kpi-label">Active Agencies</div>
        </div>
        <div class="kpi-box">
          <i
            class="fas fa-users"
            style="font-size: 1.5rem; color: var(--text-muted)"></i>
          <div class="kpi-value" id="kpi-users">-</div>
          <div class="kpi-label">Total Staff Accounts</div>
        </div>
        <div class="kpi-box">
          <i
            class="fas fa-briefcase"
            style="font-size: 1.5rem; color: var(--text-muted)"></i>
          <div class="kpi-value" id="kpi-jobs">-</div>
          <div class="kpi-label">Live Job Posts</div>
        </div>
        <div class="kpi-box">
          <i
            class="fas fa-file-audio"
            style="font-size: 1.5rem; color: var(--text-muted)"></i>
          <div class="kpi-value" id="kpi-apps">-</div>
          <div class="kpi-label">Total Candidates</div>
        </div>
      </div>

      <div class="admin-card">
        <h3
          style="
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
          ">
          <i class="fas fa-chart-bar" style="color: var(--primary-color)"></i>
          Global Agency Performance
        </h3>
        <table style="width: 100%; text-align: left; border-collapse: collapse">
          <thead>
            <tr
              style="
                border-bottom: 1px solid var(--border-color);
                color: var(--text-muted);
              ">
              <th style="padding: 10px">Agency Name</th>
              <th style="padding: 10px; text-align: right">
                Total Candidates Sourced
              </th>
            </tr>
          </thead>
          <tbody id="agencyTableBody"></tbody>
        </table>
      </div>

      <div class="admin-card">
        <h3
          style="
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
          ">
          <i class="fas fa-user-shield" style="color: #10b981"></i> Force-Create
          User (Bypass Approvals)
        </h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px">
          <div class="form-group" style="grid-column: 1 / -1">
            <label>Full Name</label>
            <input type="text" id="newUser-name" placeholder="E.g. Ziyad" />
          </div>
          <div class="form-group" style="grid-column: 1 / -1">
            <label>Login Email</label>
            <input
              type="email"
              id="newUser-email"
              placeholder="ziyad@darkwolves.com" />
          </div>
          <div class="form-group" style="grid-column: 1 / -1">
            <label>Temporary Password</label>
            <input
              type="password"
              id="newUser-password"
              placeholder="Create a secure password" />
          </div>
          <div class="form-group" style="grid-column: 1 / -1">
            <label>System Role</label>
            <select id="newUser-role">
              <option value="CEO">CEO / Agency Owner</option>
              <option value="UnitManager">Unit Manager</option>
              <option value="Leader">Team Leader</option>
              <option value="Recruiter">Recruiter</option>
              <option value="Validator">Validator (Agency Partner)</option>
              <option value="Admin">System Admin</option>
            </select>
          </div>
          <div class="form-group">
            <label>Agency Name</label>
            <input
              type="text"
              id="newUser-agency"
              placeholder="E.g. Dark Wolves" />
          </div>
          <div class="form-group">
            <label>Unit Name (Optional)</label>
            <input
              type="text"
              id="newUser-unit"
              placeholder="Leave blank if N/A" />
          </div>
          <div class="form-group" style="grid-column: 1 / -1">
            <label>Team Name (Optional)</label>
            <input
              type="text"
              id="newUser-team"
              placeholder="Leave blank if N/A" />
          </div>
          <button
            id="btn-create-user"
            onclick="createNewUser()"
            class="btn-primary"
            style="grid-column: 1 / -1">
            <i class="fas fa-check-circle"></i> Create & Approve Account
            Instantly
          </button>
        </div>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));

      // Strict Security Check!
      if (!user || (user.role !== "SuperAdmin" && user.role !== "Admin")) {
        alert("Unauthorized Access.");
        window.location.href = "login.html";
      }

      window.onload = fetchAdminStats;

      async function fetchAdminStats() {
        try {
          const res = await fetch(
            "https://voxa-pi-three.vercel.app/api/admin/stats",
          );
          const stats = await res.json();

          // Populate KPIs
          document.getElementById("kpi-agencies").innerText =
            stats.total_agencies || 0;
          document.getElementById("kpi-users").innerText =
            stats.total_users || 0;
          document.getElementById("kpi-jobs").innerText = stats.total_jobs || 0;
          document.getElementById("kpi-apps").innerText = stats.total_apps || 0;

          // Populate Agency Table
          const tbody = document.getElementById("agencyTableBody");
          tbody.innerHTML = "";

          if (stats.agency_breakdown.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="2" style="padding: 15px; color: var(--text-muted); text-align: center;">No agency data yet.</td></tr>';
          } else {
            stats.agency_breakdown.forEach((a) => {
              tbody.innerHTML += `
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 15px 10px; font-weight: bold; color: var(--primary-color);">${a.agency}</td>
                                <td style="padding: 15px 10px; text-align: right; font-size: 1.1rem; font-weight: 600;">${a.count}</td>
                            </tr>
                        `;
            });
          }
        } catch (e) {
          console.error("Failed to load admin stats", e);
        }
      }

      // Your perfected Force-Create tool
      async function createNewUser() {
        const payload = {
          fullName: document.getElementById("newUser-name").value,
          email: document.getElementById("newUser-email").value,
          password: document.getElementById("newUser-password").value,
          target_role: document.getElementById("newUser-role").value,
          target_agency: document.getElementById("newUser-agency").value,
          target_unit: document.getElementById("newUser-unit").value || null,
          target_team: document.getElementById("newUser-team").value || null,

          creator_role: user.isAdmin ? "SuperAdmin" : user.role,
          creator_agency: user.agencyName || "HQ",
        };

        if (
          !payload.email ||
          !payload.password ||
          !payload.fullName ||
          !payload.target_agency
        ) {
          return alert("Please fill in Name, Email, Password, and Agency.");
        }

        const btn = document.getElementById("btn-create-user");
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

        try {
          const res = await fetch(
            "https://voxa-pi-three.vercel.app/api/admin/users",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );

          const data = await res.json();

          if (res.ok) {
            alert("✅ " + data.message);

            // Clear the inputs
            document.getElementById("newUser-name").value = "";
            document.getElementById("newUser-email").value = "";
            document.getElementById("newUser-password").value = "";

            // Refresh the KPI numbers so you can see the total users go up instantly!
            fetchAdminStats();
          } else {
            alert("❌ Error: " + data.error);
          }
        } catch (e) {
          console.error(e);
          alert("Failed to connect to server.");
        } finally {
          btn.innerHTML = originalText;
        }
      }

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
