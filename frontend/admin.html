<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Dark Wolves</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .btn-analyze {
            background-color: #2563eb; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-analyze:hover { background-color: #1d4ed8; }
        .btn-analyze:disabled { background-color: #4b5563; cursor: not-allowed; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Dark<span>Wolves</span></a>
            <div class="admin-tag">ADMIN PORTAL</div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>Candidate Applications</h1>
                <p>Review AI-powered candidate metrics and voice intros.</p>
            </div>
            <button class="refresh-btn" onclick="checkAuthAndLoad()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>

        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th width="50">ID</th>
                        <th width="180">Candidate</th>
                        <th width="220">Voice Intro</th>
                        <th width="180">AI Grade</th> <th width="200">Contact</th>
                        <th>Experience</th>
                        <th width="120">Date</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="ai-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2><i class="fas fa-robot"></i> AI Intelligence Report</h2>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <div id="modal-content" class="modal-body"></div>
        </div>
    </div>

    <script>
        let appData = [];
        document.addEventListener('DOMContentLoaded', checkAuthAndLoad);

        async function checkAuthAndLoad() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user?.isAdmin) { window.location.href = 'login.html'; return; }
            await loadApplications();
        }

        async function loadApplications() {
            const tbody = document.getElementById('admin-table-body');
            try {
                const res = await fetch('http://127.0.0.1:5000/api/admin/applications');
                appData = await res.json();
                
                tbody.innerHTML = appData.map(app => {
                    const hasAudio = app.VoiceRecordPath && app.VoiceRecordPath !== 'null' && app.VoiceRecordPath !== 'No_File';
                    const audioContent = hasAudio 
                        ? `<audio controls src="http://127.0.0.1:5000/uploads/${app.VoiceRecordPath}" style="height:30px; width:180px;"></audio>` 
                        : '<span style="color:#666; font-style:italic;">No Audio</span>';

                    // --- Manual Trigger Logic ---
                    let aiContent;
                    if (app.AI_Rating && app.AI_Rating !== 'null') {
                        // Analysis Done: Show Grade + View Button
                        aiContent = `
                            <div class="ai-grade-cell">
                                <span class="badge badge-ai">${app.AI_Rating}</span>
                                <button onclick="openModal(${app.ApplicationID})" class="report-link">View</button>
                            </div>`;
                    } else if (hasAudio) {
                        // No Analysis yet: Show Start Button
                        aiContent = `<button id="btn-${app.ApplicationID}" onclick="startAnalysis(${app.ApplicationID})" class="btn-analyze"><i class="fas fa-magic"></i> Start AI</button>`;
                    } else {
                        aiContent = '<span style="color:#666;">N/A</span>';
                    }

                    return `
                        <tr>
                            <td>#${app.ApplicationID}</td>
                            <td><b>${app.FullName}</b><br><small>${app.JobTitle}</small></td>
                            <td>${audioContent}</td>
                            <td>${aiContent}</td>
                            <td>${app.Email}<br>${app.Phone}</td>
                            <td><div class="exp-cell">${app.Experience}</div></td>
                            <td>${app.SubmittedAt}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error("Failed to load apps:", err);
            }
        }

        async function startAnalysis(id) {
            const btn = document.getElementById(`btn-${id}`);
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
            
            try {
                const res = await fetch(`http://127.0.0.1:5000/api/admin/analyze/${id}`, { method: 'POST' });
                if (res.ok) {
                    // Poll for updates or just wait
                    setTimeout(() => checkAuthAndLoad(), 5000); // Auto-refresh after 5s
                } else {
                    alert("Analysis Failed to Start");
                    btn.disabled = false;
                    btn.innerText = "Retry AI";
                }
            } catch (e) {
                alert("Server Error");
                btn.disabled = false;
            }
        }

        function openModal(id) {
            const app = appData.find(a => a.ApplicationID === id);
            if(!app) return;
            document.getElementById('modal-content').innerHTML = `
                <div class="report-section">
                    <h3>Transcription</h3>
                    <p class="transcript-p">"${app.Transcription || 'Processing...'}"</p>
                </div>
                <div class="report-grid">
                    <div class="stat-item"><h4>Score</h4><p>${app.AI_Rating || 'N/A'}</p></div>
                    <div class="stat-item"><h4>Speech Rate</h4><p>${app.SpeechRate || 0} WPM</p></div>
                </div>
                <div class="report-section">
                    <h3>AI Personality Summary</h3>
                    <p>${app.AI_Summary || 'Analysis in progress...'}</p>
                </div>
            `;
            document.getElementById('ai-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('ai-modal').style.display = 'none'; }
    </script>
</body>
</html>
