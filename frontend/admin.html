<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Dark Wolves</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Dark<span>Wolves</span></a>
            <div style="color: white; font-weight: bold; letter-spacing: 1px; font-size: 0.9rem; border: 1px solid #333; padding: 4px 10px; border-radius: 4px;">ADMIN PORTAL</div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>Candidate Applications</h1>
                <p>Listen to voice introductions and review candidates.</p>
            </div>
            <button class="refresh-btn" onclick="checkAuthAndLoad()">
                <i class="fas fa-sync-alt"></i> Refresh Data
            </button>
        </div>

        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th width="50">ID</th>
                        <th width="180">Candidate</th>
                        <th width="180">Voice Intro</th> <th width="220">Contact Info</th>
                        <th width="150">Status</th>
                        <th width="200">National Data</th>
                        <th>Experience</th>
                        <th width="120">Date</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <tr><td colspan="8" style="text-align:center; padding: 3rem; color: #666;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndLoad();
        });

        async function checkAuthAndLoad() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                alert("Access Denied: Please login first.");
                window.location.href = 'login.html';
                return;
            }
            const user = JSON.parse(userStr);
            if (!user.isAdmin) {
                alert("Access Denied: Admin privileges required.");
                window.location.href = 'index.html';
                return;
            }
            loadApplications(user.email);
        }

        async function loadApplications(adminEmail) {
            const tbody = document.getElementById('admin-table-body');
            try {
                const response = await fetch('http://127.0.0.1:5000/api/admin/applications', {
                    headers: { 'X-Admin-Email': adminEmail }
                });

                if (response.status === 403 || response.status === 401) {
                    alert("Unauthorized.");
                    window.location.href = 'login.html';
                    return;
                }

                const apps = await response.json();
                tbody.innerHTML = '';
                
                apps.forEach(app => {
                    // Check if VoiceRecordPath exists, otherwise show placeholder
                    const audioPlayer = app.VoiceRecordPath 
                        ? `<audio controls src="http://127.0.0.1:5000/uploads/${app.VoiceRecordPath}" style="width: 200px; height: 35px;"></audio>`
                        : '<span style="color:#666; font-size:0.8rem;">No Recording</span>';

                    const row = `
                        <tr>
                            <td><span style="color:#666">#${app.ApplicationID}</span></td>
                            <td>
                                <div style="font-weight:700; color:white;">${app.FullName}</div>
                                <div style="font-size:0.8rem; color:#888;">${app.JobTitle}</div>
                            </td>
                            <td>
                                ${audioPlayer}
                            </td>
                            <td>
                                <div class="contact-row"><i class="fas fa-envelope"></i> ${app.Email}</div>
                                <div class="contact-row"><i class="fas fa-phone"></i> ${app.Phone}</div>
                            </td>
                            <td>
                                <div class="detail-group">
                                    <span class="badge badge-grad">${app.GraduationStatus || 'N/A'}</span>
                                    <br>
                                    <span class="badge">${app.EnglishLevel || 'N/A'}</span>
                                </div>
                            </td>
                            <td>
                                <div class="detail-group">
                                    <span class="detail-label">ID:</span> ${app.NationalID || 'N/A'}
                                </div>
                            </td>
                            <td>
                                <div class="experience-box">
                                    ${app.Experience || 'No details provided.'}
                                </div>
                            </td>
                            <td style="color:#666; font-size: 0.8rem;">
                                ${app.SubmittedAt}
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="8" style="color:red; text-align:center;">Failed to load data.</td></tr>';
            }
        }
    </script>
</body>
</html>
