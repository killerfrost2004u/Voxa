<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Voxa</title>
    <link rel="icon" type="image/png" href="images/voxa-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a
          href="index.html"
          class="logo"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: white;
            text-decoration: none;
          ">
          <img
            src="images/voxa-logo.png"
            alt="Voxa Logo"
            style="height: 40px; width: auto; border-radius: 8px" />
          Voxa
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="jobs.html">Find Jobs</a></li>
          <li><a href="companies.html">Companies</a></li>
          <li><a href="salaries.html">Salaries</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <div class="menu-toggle">
          <i class="fas fa-bars"></i>
        </div>
      </div>
    </nav>

    <section class="auth-container">
      <div class="auth-box" id="login-box">
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p style="color: var(--text-muted)">Login to continue the hunt</p>
        </div>
        <div class="error-msg" id="login-error"></div>
        <form id="login-form">
          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              id="login-email"
              required
              placeholder="john@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              id="login-password"
              required
              placeholder="••••••••" />
          </div>
          <button type="submit" class="btn-primary full-width">Log In</button>
        </form>
        <div class="toggle-text">
          Don't have an account? <a onclick="toggleAuth()">Sign Up</a>
        </div>
      </div>

      <div class="auth-box hidden" id="signup-box">
        <div class="auth-header">
          <h2>Join the Pack</h2>
          <p style="color: var(--text-muted)">Create your account</p>
        </div>
        <div class="error-msg" id="signup-error"></div>
        <div class="success-msg" id="signup-success"></div>
        <form
          id="signup-form"
          class="main-form"
          style="padding: 0; border: none; margin: 0">
          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              id="signup-name"
              required
              placeholder="Enter your full name" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="signup-email"
              required
              placeholder="Enter your email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              id="signup-password"
              required
              placeholder="Create a password" />
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem">
            <label
              style="
                display: flex;
                align-items: flex-start;
                gap: 10px;
                cursor: pointer;
                color: var(--text-muted);
                font-size: 0.85rem;
                font-weight: normal;
              ">
              <input
                type="checkbox"
                id="legal-checkbox"
                required
                style="
                  width: auto;
                  margin-top: 3px;
                  accent-color: var(--primary-color);
                " />
              <span
                >By signing up, I agree to the
                <a
                  href="terms.html"
                  style="
                    color: var(--primary-color);
                    text-decoration: underline;
                  "
                  target="_blank"
                  >Terms of Service</a
                >
                and
                <a
                  href="privacy.html"
                  style="
                    color: var(--primary-color);
                    text-decoration: underline;
                  "
                  target="_blank"
                  >Privacy Policy</a
                >, and I consent to the automated AI analysis of my voice
                recordings.</span
              >
            </label>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%">
            Sign Up
          </button>
          <p class="toggle-text">
            Already have an account? <a onclick="toggleAuth()">Log In</a>
          </p>
        </form>
      </div>
    </section>

    <footer>
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 Voxa. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script src="js/auth.js"></script>
  </body>
</html>
