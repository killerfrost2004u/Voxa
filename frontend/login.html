<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dark Wolves</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Dark<span>Wolves</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html">Find Jobs</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-container">
        
        <div class="auth-box" id="login-box">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p style="color:var(--text-muted)">Login to continue the hunt</p>
            </div>
            <div class="error-msg" id="login-error"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary full-width">Log In</button>
            </form>
            <div class="toggle-text">
                Don't have an account? <a onclick="toggleAuth()">Sign Up</a>
            </div>
        </div>

        <div class="auth-box hidden" id="signup-box">
            <div class="auth-header">
                <h2>Join the Pack</h2>
                <p style="color:var(--text-muted)">Create your account</p>
            </div>
            <div class="error-msg" id="signup-error"></div>
            <div class="success-msg" id="signup-success"></div>
            <form id="signup-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn-primary full-width">Sign Up</button>
            </form>
            <div class="toggle-text">
                Already have an account? <a onclick="toggleAuth()">Log In</a>
            </div>
        </div>

    </section>

    <script src="js/auth.js"></script>
</body>
</html>
