<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs | Dark Wolves</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Dark<span>Wolves</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html" class="active">Find Jobs</a></li>
                <li><a href="companies.html">Companies</a></li>
                <li><a href="salaries.html">Salaries</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="login.html" class="btn-text">Log In</a>
                <a href="login.html" class="btn-primary">Sign Up</a>
            </div>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Browse Jobs</h1>
            <p>Find your next mission from thousands of opportunities.</p>
        </div>
    </header>

    <div class="container jobs-layout">
        
        <aside class="sidebar">
            <div class="filter-group">
                <h3><i class="fas fa-filter"></i> Filter</h3>
                
                <div class="filter-item">
                    <label>Keywords</label>
                    <div class="input-with-icon">
                        <i class="fas fa-search"></i>
                        <input type="text" id="keyword-filter" placeholder="Job title...">
                    </div>
                </div>
                
                <div class="filter-item">
                    <label>Location</label>
                    <div class="input-with-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="location-filter" placeholder="City...">
                    </div>
                </div>

                <div class="filter-item">
                    <label>Job Type</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="Full Time" onchange="applyFilters()"> Full Time</label>
                        <label><input type="checkbox" value="Part Time" onchange="applyFilters()"> Part Time</label>
                        <label><input type="checkbox" value="Rotational" onchange="applyFilters()"> Rotational</label>
                    </div>
                </div>

                <div class="filter-item">
                    <label>Salary Range</label>
                    <input type="range" min="30" max="200" value="50" class="slider" id="salary-range">
                    <div class="range-value" style="color:var(--text-muted); margin-top:5px;">Min: <span id="salary-val" style="color:var(--primary-color)">50</span>k</div>
                </div>

                <button class="btn-primary full-width" onclick="applyFilters()">Apply Filters</button>
                <button class="reset-btn" onclick="location.reload()">Reset</button>
            </div>
        </aside>

        <main class="job-feed">
            <div class="feed-header">
                <span id="job-count">Loading Jobs...</span>
                <div class="sort-box">
                    <label>Sort by:</label>
                    <select id="sort-jobs" onchange="sortJobs()">
                        <option value="newest">Newest</option>
                        <option value="salary">Highest Salary</option>
                    </select>
                </div>
            </div>

            <div class="jobs-list" id="all-jobs-container">
                </div>
            
            <div class="pagination">
                <button class="page-btn disabled"><i class="fas fa-chevron-left"></i></button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="apply-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-job-title">Join the Pack</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form class="apply-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Upload Resume/CV</label>
                    <div class="file-upload">
                        <label><i class="fas fa-cloud-upload-alt"></i> Click to upload PDF</label>
                    </div>
                </div>
                <button type="submit" class="btn-primary full-width">Submit Application</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Dark Wolves. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
