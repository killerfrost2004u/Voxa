<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR & B2B Workspace | Voxa</title>
    <link rel="icon" type="image/png" href="images/voxa-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      .dashboard-header {
        background: var(--bg-card);
        padding: 20px 30px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      /* Tabs */
      .admin-tabs {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
        overflow-x: auto;
        white-space: nowrap;
      }
      .tab-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.1rem;
        cursor: pointer;
        padding: 5px 10px;
        font-weight: 600;
        transition: 0.3s;
      }
      .tab-btn.active {
        color: var(--primary-color);
        border-bottom: 3px solid var(--primary-color);
      }

      .leaderboard-card {
        background: var(--bg-card);
        padding: 25px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 30px;
      }

      /* Job Form (Imported from Admin) */
      .job-form {
        background: var(--bg-input);
        padding: 20px;
        border-radius: 8px;
        border: 1px dashed var(--primary-color);
        margin-bottom: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 15px;
      }
      .job-form input,
      .job-form select,
      .job-form textarea {
        background: var(--bg-card);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 10px;
        border-radius: 5px;
        width: 100%;
        outline: none;
        font-family: inherit;
      }

      .btn-primary {
        background: var(--primary-color);
        color: #000;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      .btn-outline {
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .btn-outline:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
        background: rgba(0, 229, 255, 0.1);
      }

      /* CRM Kanban Board */
      .kanban-board {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 15px;
      }
      .kanban-col {
        flex: 1;
        min-width: 280px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
      }
      .kanban-col h4 {
        border-bottom: 2px solid var(--primary-color);
        padding-bottom: 10px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
      }
      .crm-card {
        background: var(--bg-card);
        padding: 15px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.2s;
      }
      .crm-card:hover {
        border-color: var(--primary-color);
        transform: translateY(-2px);
      }
      .company-logo-placeholder {
        width: 30px;
        height: 30px;
        background: var(--primary-color);
        color: black;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        margin-right: 10px;
      }
      /* Modals */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      .modal-card {
        background: var(--bg-card);
        padding: 30px;
        border-radius: 12px;
        width: 90%;
        max-width: 500px;
        border: 1px solid var(--border-color);
      }
      .modal-card input,
      .modal-card select,
      .modal-card textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        background: var(--bg-input);
        color: white;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        outline: none;
        font-family: inherit;
      }
      .btn-cancel {
        background: transparent;
        color: var(--text-muted);
        border: none;
        width: 100%;
        margin-top: 10px;
        cursor: pointer;
        padding: 10px;
      }
    </style>
  </head>
  <body style="background: var(--bg-main); color: var(--text-main)">
    <div class="dashboard-header">
      <div>
        <h2 id="dashboardTitle">HR & B2B Workspace</h2>
        <p
          id="roleBadge"
          style="
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 10px;
          "></p>
      </div>
      <div>
        <div
          id="workspace-switcher"
          style="display: inline-flex; gap: 10px; margin-right: 15px"></div>
        <button
          onclick="window.logout()"
          class="btn-outline"
          style="padding: 8px 15px">
          Logout
        </button>
      </div>
    </div>

    <div class="container">
      <div class="admin-tabs">
        <button
          class="tab-btn active"
          onclick="switchTab('jobs')"
          id="tab-jobs">
          <i class="fas fa-briefcase"></i> Job Postings
        </button>
        <button class="tab-btn" onclick="switchTab('crm')" id="tab-crm">
          <i class="fas fa-handshake"></i> B2B Client CRM
        </button>
        <button class="tab-btn" onclick="switchTab('slots')" id="tab-slots">
          <i class="fas fa-calendar-alt"></i> HR Calendar Slots
        </button>
      </div>

      <div id="section-jobs">
        <div class="leaderboard-card">
          <h3 style="margin-bottom: 15px; color: var(--primary-color)">
            <i class="fas fa-plus-circle"></i> Create / Edit Job Offer
          </h3>
          <div class="job-form">
            <input
              type="text"
              id="jCompany"
              placeholder="Client Company Name (e.g. Teleperformance)" />
            <input
              type="text"
              id="jTitle"
              placeholder="Job Title (e.g. Bilingual Agent)" />
            <input
              type="text"
              id="jAccount"
              placeholder="Account Type (e.g. Travel, Real Estate)" />

            <input
              type="text"
              id="jHours"
              placeholder="Working Hours / Shifts" />
            <input
              type="text"
              id="jInterview"
              placeholder="Interview Time/Process" />
            <input
              type="text"
              id="jSalary"
              placeholder="Salary Package (e.g. 15k EGP + Bonus)" />

            <input
              type="text"
              id="jTarget"
              placeholder="Target Audience / Max Age" />
            <input
              type="text"
              id="jLocation"
              placeholder="Location (e.g. Maadi, WFH)" />
            <input
              type="text"
              id="jTraining"
              placeholder="Training Details (Duration/Paid?)" />

            <textarea
              id="jOffer"
              placeholder="Extra specific requirements or benefits..."
              style="
                grid-column: span 3;
                resize: vertical;
                min-height: 60px;
              "></textarea>

            <select id="jBilingual" style="grid-column: span 3">
              <option value="0">🇺🇸 English Only (1 Voice Note Required)</option>
              <option value="1">
                🌍 Bilingual Role (2 Voice Notes Required)
              </option>
            </select>

            <button
              id="btn-submit-job"
              onclick="saveJobData()"
              class="btn-primary"
              style="grid-column: span 3">
              + Publish Job to Website
            </button>
          </div>

          <table
            style="
              width: 100%;
              text-align: left;
              border-collapse: collapse;
              margin-top: 20px;
            ">
            <thead>
              <tr
                style="
                  border-bottom: 1px solid var(--border-color);
                  color: var(--text-muted);
                ">
                <th style="padding: 10px">ID</th>
                <th style="padding: 10px">Role & Company</th>
                <th style="padding: 10px">Package</th>
                <th style="padding: 10px">Status</th>
                <th style="padding: 10px">Actions</th>
              </tr>
            </thead>
            <tbody id="jobs-table-body">
              <tr>
                <td colspan="5" style="text-align: center; padding: 20px">
                  <i class="fas fa-spinner fa-spin"></i> Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="section-crm" style="display: none">
        <div class="leaderboard-card" style="padding-bottom: 10px">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
            ">
            <h3>
              <i
                class="fas fa-building"
                style="color: var(--primary-color)"></i>
              Company Acquisition Pipeline
            </h3>
            <button
              class="btn-outline"
              onclick="window.openLeadModal()"
              style="background: var(--primary-color); color: black">
              + Add New Lead
            </button>
          </div>

          <div class="kanban-board">
            <div class="kanban-col">
              <h4>
                Prospects
                <span
                  id="count-prospects"
                  style="
                    background: var(--bg-card);
                    padding: 2px 8px;
                    border-radius: 10px;
                    font-size: 0.8rem;
                  "
                  >0</span
                >
              </h4>
              <div id="col-prospects"></div>
            </div>

            <div class="kanban-col">
              <h4 style="border-color: #00e5ff">
                Meetings
                <span
                  id="count-meetings"
                  style="
                    background: var(--bg-card);
                    padding: 2px 8px;
                    border-radius: 10px;
                    font-size: 0.8rem;
                  "
                  >0</span
                >
              </h4>
              <div id="col-meetings"></div>
            </div>

            <div class="kanban-col">
              <h4 style="border-color: #10b981">
                Signed Clients
                <span
                  id="count-signed"
                  style="
                    background: var(--bg-card);
                    padding: 2px 8px;
                    border-radius: 10px;
                    font-size: 0.8rem;
                  "
                  >0</span
                >
              </h4>
              <div id="col-signed"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="section-slots" style="display: none">
        <div class="leaderboard-card">
          <h3 style="margin-bottom: 15px; color: var(--primary-color)">
            <i class="fas fa-calendar-plus"></i> Create Interview Slots
          </h3>
          <div class="job-form">
            <input type="text" id="slotJob" placeholder="Job Title (e.g. Telesales)" />
            <input type="text" id="slotAgency" placeholder="Agency Name (e.g. Dark Wolves)" />
            <input type="date" id="slotDate" />
            <input type="text" id="slotTime" placeholder="Time Block (e.g. 10:00 AM - 12:00 PM)" />
            <input type="number" id="slotCapacity" placeholder="Number of Slots (e.g. 10)" />
            <button onclick="createSlot()" class="btn-primary" style="grid-column: span 3;">+ Create Slot Block</button>
          </div>
          
          <table style="width: 100%; text-align: left; border-collapse: collapse; margin-top: 20px;">
            <thead>
              <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-muted);">
                <th style="padding: 10px">Job & Agency</th>
                <th style="padding: 10px">Date & Time</th>
                <th style="padding: 10px">Capacity</th>
                <th style="padding: 10px">Booked</th>
                <th style="padding: 10px">Action</th>
              </tr>
            </thead>
            <tbody id="slots-table-body">
              <tr>
                <td colspan="5" style="text-align: center; padding: 20px">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="modal-overlay" id="leadModal">
        <div class="modal-card">
          <h3 style="margin-bottom: 15px; color: var(--primary-color)">
            <i class="fas fa-handshake"></i> Add / Edit Lead
          </h3>
          <input type="hidden" id="leadId" />

          <label style="font-size: 0.85rem; color: var(--text-muted)"
            >Company Name</label
          >
          <input
            type="text"
            id="leadCompany"
            placeholder="e.g. Teleperformance"
            required />

          <label style="font-size: 0.85rem; color: var(--text-muted)"
            >Contact Person</label
          >
          <input
            type="text"
            id="leadContact"
            placeholder="e.g. John Doe (HR Manager)" />

          <label style="font-size: 0.85rem; color: var(--text-muted)"
            >Pipeline Stage</label
          >
          <select id="leadStatus">
            <option value="Prospect">Prospect (Cold Outreach)</option>
            <option value="Meeting">Meeting (In Talks)</option>
            <option value="Signed">Signed Client (Active)</option>
          </select>

          <label style="font-size: 0.85rem; color: var(--text-muted)"
            >Next Action / Highlight</label
          >
          <input
            type="text"
            id="leadAction"
            placeholder="e.g. Call tomorrow at 2 PM" />

          <button
            type="button"
            onclick="saveLeadData()"
            class="btn-primary"
            id="btn-submit-lead">
            Save Lead
          </button>
          <button type="button" class="btn-cancel" onclick="closeLeadModal()">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script>
      let adminJobsData = [];
      let editingJobId = null;

      const userStr = localStorage.getItem("user");
      if (!userStr) window.location.href = "login.html";
      const user = JSON.parse(userStr);

      const userRoles = (user.role || "").split(",").map((r) => r.trim());
      if (
        !userRoles.includes("HR") &&
        !userRoles.includes("CEO") &&
        !userRoles.includes("SuperAdmin")
      ) {
        alert("Unauthorized. HR Access Required.");
        window.location.href = "login.html";
      }

      document.getElementById("roleBadge").innerText =
        `${user.role} | ${user.agencyName}`;

      // WORKSPACE SWITCHER LOGIC
      const switcher = document.getElementById("workspace-switcher");
      if (userRoles.length > 1) {
        if (userRoles.includes("Validator"))
          switcher.innerHTML += `<button onclick="window.location.href='validator.html'" class="btn-outline"><i class="fas fa-check-double"></i> Validator Desk</button>`;
        if (
          userRoles.includes("Leader") ||
          userRoles.includes("UnitManager") ||
          userRoles.includes("CEO")
        )
          switcher.innerHTML += `<button onclick="window.location.href='agency-dashboard.html'" class="btn-outline"><i class="fas fa-users"></i> Agency Desk</button>`;
      }

      window.onload = () => {
        loadAdminJobs();
        loadSlots();
        loadCRMLeads();
      };

      function switchTab(tab) {
        document.getElementById("section-jobs").style.display = "none";
        document.getElementById("section-crm").style.display = "none";
        document.getElementById("section-slots").style.display = "none";
        document.getElementById("tab-jobs").classList.remove("active");
        document.getElementById("tab-crm").classList.remove("active");
        document.getElementById("tab-slots").classList.remove("active");

        document.getElementById(`section-${tab}`).style.display = "block";
        document.getElementById(`tab-${tab}`).classList.add("active");
      }

      // --- JOB MANAGEMENT API (Shared with Admin) ---
      async function loadAdminJobs() {
        const tbody = document.getElementById("jobs-table-body");
        try {
          const res = await fetch(
            "https://voxa-pi-three.vercel.app/api/admin/jobs",
          );
          adminJobsData = await res.json();

          if (adminJobsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:var(--text-muted);">No jobs published yet.</td></tr>`;
            return;
          }

          tbody.innerHTML = adminJobsData
            .map(
              (j) => `
                <tr style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 10px;">#${j.JobID}</td>
                    <td style="padding: 10px;"><b>${j.JobTitle}</b><br><small style="color:var(--primary-color);">${j.CompanyName}</small></td>
                    <td style="padding: 10px; color: var(--text-muted); font-size: 0.9rem;">${j.SalaryPackage}</td>
                    <td style="padding: 10px;"><button onclick="toggleJobStatus(${j.JobID}, '${j.Status}')" style="background:${j.Status === "Active" ? "rgba(0, 229, 255, 0.1)" : "rgba(245, 158, 11, 0.1)"}; color:${j.Status === "Active" ? "var(--primary-color)" : "#f59e0b"}; border:1px solid; border-radius:4px; padding: 4px 8px; cursor:pointer;">${j.Status}</button></td>
                    <td style="padding: 10px;">
                        <button onclick="editJob(${j.JobID})" style="background:none; border:none; color:var(--primary-color); cursor:pointer; margin-right: 12px;"><i class="fas fa-edit"></i> Edit</button>
                    </td>
                </tr>`,
            )
            .join("");
        } catch (e) {
          console.error(e);
        }
      }

      window.editJob = function (id) {
        const job = adminJobsData.find((j) => j.JobID === id);
        if (!job) return;
        editingJobId = id;
        document.getElementById("jCompany").value = job.CompanyName || "";
        document.getElementById("jTitle").value = job.JobTitle || "";
        document.getElementById("jAccount").value = job.AccountType || "";
        document.getElementById("jHours").value = job.WorkingHours || "";
        document.getElementById("jInterview").value = job.InterviewTime || "";
        document.getElementById("jSalary").value = job.SalaryPackage || "";
        document.getElementById("jTarget").value = job.TargetAudience || "";
        document.getElementById("jLocation").value = job.Location || "";
        document.getElementById("jTraining").value = job.Training || "";
        document.getElementById("jOffer").value = job.OfferDetails || "";
        document.getElementById("jBilingual").value = job.RequiresSecondLanguage
          ? "1"
          : "0";

        const submitBtn = document.getElementById("btn-submit-job");
        submitBtn.innerHTML = `<i class="fas fa-save"></i> Update Published Job`;
        submitBtn.style.background = "#f59e0b";
      };

      // --- HR SLOTS API ---
      async function loadSlots() {
          try {
              const res = await fetch('https://voxa-pi-three.vercel.app/api/hr/slots');
              const slots = await res.json();
              const tbody = document.getElementById("slots-table-body");
              if (slots.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px">No slots created yet.</td></tr>';
                  return;
              }
              tbody.innerHTML = slots.map(s => `
                  <tr style="border-bottom: 1px solid var(--border-color);">
                      <td style="padding: 10px;"><b>${s.JobTitle}</b><br><small style="color:var(--primary-color);">${s.AgencyName}</small></td>
                      <td style="padding: 10px;">${s.SlotDate}<br><small>${s.SlotTime}</small></td>
                      <td style="padding: 10px;">${s.Capacity}</td>
                      <td style="padding: 10px;">${s.Booked}</td>
                      <td style="padding: 10px;"><button onclick="deleteSlot(${s.SlotID})" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fas fa-trash"></i></button></td>
                  </tr>
              `).join("");
          } catch(e) { console.error(e); }
      }
      
      window.createSlot = async function() {
          const payload = {
              jobTitle: document.getElementById("slotJob").value,
              agencyName: document.getElementById("slotAgency").value,
              date: document.getElementById("slotDate").value,
              time: document.getElementById("slotTime").value,
              capacity: document.getElementById("slotCapacity").value
          };
          await fetch('https://voxa-pi-three.vercel.app/api/hr/slots', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          loadSlots();
      }
      
      window.deleteSlot = async function(id) {
          await fetch(`https://voxa-pi-three.vercel.app/api/hr/slots/${id}`, { method: 'DELETE' });
          loadSlots();
      }

      window.saveJobData = async function () {
        const payload = {
          companyName: document.getElementById("jCompany").value,
          jobTitle: document.getElementById("jTitle").value,
          accountType: document.getElementById("jAccount").value,
          workingHours: document.getElementById("jHours").value,
          interviewTime: document.getElementById("jInterview").value,
          salaryPackage: document.getElementById("jSalary").value,
          targetAudience: document.getElementById("jTarget").value,
          location: document.getElementById("jLocation").value,
          training: document.getElementById("jTraining").value,
          offerDetails: document.getElementById("jOffer").value,
          requiresSecondLanguage: document.getElementById("jBilingual").value,
        };
        if (!payload.jobTitle) return alert("Job Title is required!");
        const submitBtn = document.getElementById("btn-submit-job");
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = "Saving...";
        try {
          if (editingJobId) {
            await fetch(
              `https://voxa-pi-three.vercel.app/api/admin/jobs/${editingJobId}`,
              {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              },
            );
          } else {
            await fetch("https://voxa-pi-three.vercel.app/api/admin/jobs", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          }
          editingJobId = null;
          document
            .querySelectorAll(".job-form input, .job-form textarea")
            .forEach((el) => (el.value = ""));
          submitBtn.innerHTML = `+ Publish Job to Website`;
          submitBtn.style.background = "var(--primary-color)";
          loadAdminJobs();
        } catch (e) {
          alert("Failed to save.");
          submitBtn.innerHTML = originalText;
        }
      };

      window.toggleJobStatus = async function (id, currentStatus) {
        const newStatus = currentStatus === "Active" ? "On Hold" : "Active";
        await fetch(`https://voxa-pi-three.vercel.app/api/admin/jobs/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        loadAdminJobs();
      };

      window.logout = function () {
        localStorage.removeItem("user");
        window.location.href = "login.html";
      };
      // --- GLOBALS ---
      let crmLeadsData = [];

      // --- CRM MODAL LOGIC ---
      window.openLeadModal = function (leadId = null) {
        const modal = document.getElementById("leadModal");

        // Bulletproof CSS override to force visibility
        modal.style.cssText = `
              display: flex !important;
              position: fixed !important;
              top: 0 !important;
              left: 0 !important;
              width: 100vw !important;
              height: 100vh !important;
              background-color: rgba(0, 0, 0, 0.85) !important;
              z-index: 9999999 !important;
              justify-content: center !important;
              align-items: center !important;
              opacity: 1 !important;
              visibility: visible !important;
              pointer-events: auto !important;
          `;

        if (leadId && typeof leadId === "number") {
          const lead = crmLeadsData.find((l) => l.LeadID === leadId);
          if (lead) {
            document.getElementById("leadId").value = lead.LeadID;
            document.getElementById("leadCompany").value = lead.CompanyName;
            document.getElementById("leadContact").value = lead.ContactName;
            document.getElementById("leadStatus").value = lead.Status;
            document.getElementById("leadAction").value = lead.ActionItem;
            document.getElementById("btn-submit-lead").innerText =
              "Update Lead";
          }
        } else {
          document.getElementById("leadId").value = "";
          document.getElementById("leadCompany").value = "";
          document.getElementById("leadContact").value = "";
          document.getElementById("leadStatus").value = "Prospect";
          document.getElementById("leadAction").value = "";
          document.getElementById("btn-submit-lead").innerText = "Save Lead";
        }
      };

      window.closeLeadModal = function () {
        const modal = document.getElementById("leadModal");
        if (modal) modal.style.cssText = "display: none !important;";
      };

      // --- CRM API LOGIC ---
      async function loadCRMLeads() {
        try {
          // Note: You will need to create this endpoint in your backend
          const res = await fetch(
            `https://voxa-pi-three.vercel.app/api/hr/leads?agency=${encodeURIComponent(user.agencyName)}`,
          );
          crmLeadsData = await res.json();

          const colProspects = document.getElementById("col-prospects");
          const colMeetings = document.getElementById("col-meetings");
          const colSigned = document.getElementById("col-signed");

          colProspects.innerHTML = "";
          colMeetings.innerHTML = "";
          colSigned.innerHTML = "";
          let countP = 0,
            countM = 0,
            countS = 0;

          crmLeadsData.forEach((lead) => {
            const initials = lead.CompanyName.substring(0, 2).toUpperCase();

            // Determine icon and color based on status
            let icon = "fa-clock";
            let color = "#f59e0b";
            if (lead.Status === "Meeting") {
              icon = "fa-calendar";
              color = "#00e5ff";
            }
            if (lead.Status === "Signed") {
              icon = "fa-check-circle";
              color = "#10b981";
            }

            const cardHtml = `
                    <div class="crm-card" onclick="openLeadModal(${lead.LeadID})">
                        <div style="display: flex; align-items: center; margin-bottom: 10px;">
                            <div class="company-logo-placeholder">${initials}</div>
                            <strong>${lead.CompanyName}</strong>
                        </div>
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin:0;">Contact: ${lead.ContactName || "N/A"}</p>
                        <p style="font-size: 0.8rem; color: ${color}; margin-top:5px;"><i class="fas ${icon}"></i> ${lead.ActionItem || "No action set"}</p>
                    </div>
                  `;

            if (lead.Status === "Prospect") {
              colProspects.innerHTML += cardHtml;
              countP++;
            } else if (lead.Status === "Meeting") {
              colMeetings.innerHTML += cardHtml;
              countM++;
            } else if (lead.Status === "Signed") {
              colSigned.innerHTML += cardHtml;
              countS++;
            }
          });

          document.getElementById("count-prospects").innerText = countP;
          document.getElementById("count-meetings").innerText = countM;
          document.getElementById("count-signed").innerText = countS;
        } catch (e) {
          console.error("Failed to load CRM leads", e);
        }
      }

      async function saveLeadData() {
        const payload = {
          agencyName: user.agencyName,
          companyName: document.getElementById("leadCompany").value,
          contactName: document.getElementById("leadContact").value,
          status: document.getElementById("leadStatus").value,
          actionItem: document.getElementById("leadAction").value,
        };

        if (!payload.companyName) return alert("Company name is required!");

        const leadId = document.getElementById("leadId").value;
        const url = leadId
          ? `https://voxa-pi-three.vercel.app/api/hr/leads/${leadId}`
          : `https://voxa-pi-three.vercel.app/api/hr/leads`;
        const method = leadId ? "PUT" : "POST";

        const btn = document.getElementById("btn-submit-lead");
        btn.innerText = "Saving...";

        try {
          await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          closeLeadModal();
          loadCRMLeads(); // Reload the board
        } catch (e) {
          console.error(e);
          alert("Error saving lead");
          btn.innerText = "Save Lead";
        }
      }
    </script>
  </body>
</html>
