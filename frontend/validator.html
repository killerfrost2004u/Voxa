<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Validation Portal | Voxa</title>
    <link rel="icon" type="image/png" href="images/voxa-logo.png">
    <link rel="stylesheet" href="css/validator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">VO<span>XA</span></div>
        <nav>
            <div class="nav-item active"><i class="fas fa-check-circle"></i> Validate Candidates</div>
        </nav>
        <div style="margin-top:auto; border-top:1px solid var(--border-color); padding-top:1.5rem; text-align:center;">
            <p style="color:var(--text-muted); font-size:0.8rem; margin: 0 0 5px 0;">Logged in as Validator</p>
            <h4 id="agency-name-display" style="color:var(--primary-color); margin: 0; font-size: 1.2rem;">Loading...</h4>
            <a onclick="logout()" style="color:#ef4444; font-size:0.9rem; cursor:pointer; display:block; margin-top:15px; font-weight: 600;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h1>Validation Queue</h1>
                <p>Listen to candidate audio and submit your agency's final grade.</p>
            </div>
            <input type="text" id="app-search" placeholder="Search by name or job title..." oninput="filterTable()">
        </header>

        <section class="admin-card">
            <div class="table-container">
                <table id="applications-table">
                    <thead>
                        <tr>
                            <th>Candidate Details</th>
                            <th>Job Profile</th>
                            <th>AI Assessment</th>
                            <th>Voice Recordings</th>
                            <th>Your Agency Grade</th>
                        </tr>
                    </thead>
                    <tbody id="app-table-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        let currentAgency = "";
        let applicationsData = [];

        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('user');
            if (!userStr) return window.location.href = 'login.html';
            
            const user = JSON.parse(userStr);
            
            // SECURITY CHECK
            if (user.role !== 'Validator' && user.role !== 'SuperAdmin' && user.role !== 'Admin') {
                alert("Unauthorized Access.");
                window.location.href = 'index.html';
                return;
            }

            currentAgency = user.team || "Unknown Agency";
            document.getElementById('agency-name-display').textContent = currentAgency;

            loadApplications();
        });

        async function loadApplications() {
            try {
                // Fetch ALL applications, joining the specific agency's grades
                const res = await fetch(`http://127.0.0.1:5000/api/validator/applications?agency=${encodeURIComponent(currentAgency)}`);
                applicationsData = await res.json();
                renderTable(applicationsData);
            } catch(e) {
                console.error("Error loading queue.", e);
                document.getElementById('app-table-body').innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ef4444;">Failed to load candidate data. Is the backend running?</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('app-table-body');
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 3rem; color:var(--text-muted);">No candidates currently in the system.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(app => {
                
                // Process Audio Elements
                const hasAudio1 = app.VoiceRecordPath && app.VoiceRecordPath !== 'null' && app.VoiceRecordPath !== 'No_File';
                const audio1 = hasAudio1 ? `<div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">Primary Audio:</div><audio controls src="http://127.0.0.1:5000/uploads/${app.VoiceRecordPath}" class="custom-audio"></audio>` : '<span style="color:#666; font-style:italic;">No Audio 1</span>';
                
                const hasAudio2 = app.VoiceRecordPath2 && app.VoiceRecordPath2 !== 'null' && app.VoiceRecordPath2 !== 'No_File';
                const audio2 = hasAudio2 ? `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:10px; margin-bottom:4px;">Secondary Audio:</div><audio controls src="http://127.0.0.1:5000/uploads/${app.VoiceRecordPath2}" class="custom-audio"></audio>` : '';
                
                // Process AI Grade
                const aiGradeHTML = (app.AI_Rating && app.AI_Rating !== 'null') 
                    ? `<span style="background:rgba(0, 229, 255, 0.1); color:var(--primary-color); padding:4px 8px; border-radius:6px; font-weight:bold; font-size:0.9rem; border: 1px solid var(--primary-color);">${app.AI_Rating}</span>`
                    : `<span style="color:var(--text-muted); font-style:italic;">Pending Analysis</span>`;

                // Determine Current Agency Grade Status
                const currentGrade = app.AgencyGrade || "Pending";
                const isGraded = currentGrade !== "Pending";
                
                // Style the grade button based on status
                const gradeBtnStyle = isGraded 
                    ? `background: rgba(0, 229, 255, 0.1); color: var(--primary-color); border: 1px solid var(--primary-color);` 
                    : `background: var(--bg-input); color: var(--text-main); border: 1px dashed var(--border-color);`;
                
                const gradeIcon = isGraded ? `<i class="fas fa-edit" style="margin-left:8px; font-size:0.8rem; opacity:0.7;"></i>` : ``;

                return `
                    <tr>
                        <td>
                            <div style="font-weight:700; font-size:1.05rem; margin-bottom:4px;">${app.FullName}</div>
                            <div style="color:var(--text-muted); font-size:0.85rem;"><i class="fas fa-envelope" style="width:16px;"></i> ${app.Email}</div>
                            <div style="color:var(--text-muted); font-size:0.85rem;"><i class="fas fa-phone" style="width:16px;"></i> ${app.Phone}</div>
                        </td>
                        <td>
                            <div style="font-weight:600;">${app.JobTitle}</div>
                            <div style="color:#f59e0b; font-size:0.85rem; margin-top:4px;"><i class="fas fa-briefcase" style="width:16px;"></i> Ref: ${app.RecruiterSource || 'Direct'}</div>
                        </td>
                        <td>
                            <div style="margin-bottom: 8px;">${aiGradeHTML}</div>
                            ${(app.AI_Summary && app.AI_Summary !== 'null') ? `<div style="font-size:0.8rem; color:var(--text-muted); max-width:250px; line-height:1.4;">${app.AI_Summary.substring(0, 60)}...</div>` : ''}
                        </td>
                        <td>${audio1}${audio2}</td>
                        <td>
                            <button onclick="submitAgencyGrade(${app.ApplicationID})" style="padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; width: 100%; max-width: 150px; ${gradeBtnStyle}">
                                ${currentGrade} ${gradeIcon}
                            </button>
                            ${app.ValidatorNotes ? `<div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px; max-width:150px; font-style:italic;">"${app.ValidatorNotes}"</div>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function submitAgencyGrade(appId) {
            const grade = prompt(`Enter ${currentAgency}'s validation grade (e.g. C1, B2, Rejected):`);
            if(!grade) return;
            
            const notes = prompt(`Any specific internal notes for ${currentAgency}? (Optional)`);

            try {
                await fetch(`http://127.0.0.1:5000/api/validator/grade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        applicationId: appId,
                        agencyName: currentAgency,
                        grade: grade,
                        notes: notes || ""
                    })
                });
                loadApplications(); // Refresh the UI immediately
            } catch(e) {
                alert("Failed to save grade to the server.");
            }
        }

        function filterTable() {
            const q = document.getElementById('app-search').value.toLowerCase();
            const filtered = applicationsData.filter(a => a.FullName.toLowerCase().includes(q) || a.JobTitle.toLowerCase().includes(q));
            renderTable(filtered);
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
