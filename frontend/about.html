<!doctype html>
<html lang="en">
  <head>
    <meta name="view-transition" content="same-origin" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us | Voxa</title>
    <link rel="icon" type="image/png" href="images/voxa-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Unique styles for About page stats */
      .stat-number {
        font-size: 3.5rem;
        font-weight: 800;
        background: -webkit-linear-gradient(#fff, var(--primary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
      }
      .stat-label {
        font-size: 1.1rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      /* Wolf Image Styling */
      .wolf-img {
        width: 150px;
        height: 150px;
        margin-bottom: 1.5rem;
        border-radius: 50%; /* Make it circular */
        border: 3px solid var(--primary-color);
        box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        object-fit: cover; /* Ensures image fills the circle */
        transition: transform 0.3s ease;
        cursor: pointer; /* Indicates clickable */
      }
      .wolf-img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(255, 102, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a
          href="index.html"
          class="logo"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: white;
            text-decoration: none;
          "
        >
          <img
            src="images/voxa-logo.png"
            alt="Voxa Logo"
            style="height: 40px; width: auto; border-radius: 8px"
          />
          Voxa
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html" class="active">About Us</a></li>
          <li><a href="jobs.html">Find Jobs</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <div class="auth-buttons">
          <a href="login.html" class="btn-text">Log In</a>
          <a href="login.html" class="btn-primary">Sign Up</a>
        </div>
        <div class="menu-toggle">
          <i class="fas fa-bars"></i>
        </div>
      </div>
    </nav>

    <header class="page-header">
      <div class="container">
        <h1>About Voxa</h1>
        <p>Redefining how global talent meets elite opportunities.</p>
      </div>
    </header>

    <section class="section-padding">
      <div class="container">
        <div
          style="
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
          "
        >
          <h2
            style="
              color: var(--primary-color);
              margin-bottom: 1.5rem;
              text-align: center;
            "
          >
            Join The Pack
          </h2>
          <p
            style="
              color: var(--text-muted);
              line-height: 1.8;
              margin-bottom: 1.5rem;
              text-align: justify;
            "
          >
            At Voxa, we bridge the gap between global talent and elite remote
            opportunities.
          </p>
          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
              gap: 20px;
              text-align: center;
              border-top: 1px solid #333;
              padding-top: 2rem;
            "
          >
            <div>
              <i
                class="fas fa-robot"
                style="color: var(--primary-color); font-size: 2rem"
              ></i>
              <h3>AI-Driven</h3>
            </div>
            <div>
              <i
                class="fas fa-globe"
                style="color: var(--primary-color); font-size: 2rem"
              ></i>
              <h3>Global</h3>
            </div>
            <div>
              <i
                class="fas fa-bolt"
                style="color: var(--primary-color); font-size: 2rem"
              ></i>
              <h3>Fast</h3>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
