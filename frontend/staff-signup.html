<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Registration | Voxa</title>
    <link rel="icon" type="image/png" href="images/voxa-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />

    <style>
      .signup-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 140px);
        padding: 40px 20px;
        background: var(--bg-main, #0b0f19);
      }
      .signup-card {
        background: var(--bg-card, #161b22);
        padding: 40px;
        border-radius: 12px;
        border: 1px solid var(--border-color, #2d3548);
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .signup-card h2 {
        text-align: center;
        margin-bottom: 8px;
        color: white;
        font-size: 1.8rem;
      }
      .signup-card p.subtitle {
        text-align: center;
        color: var(--text-muted, #8b949e);
        margin-bottom: 30px;
        font-size: 0.95rem;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-main, #c9d1d9);
        font-size: 0.9rem;
        font-weight: 500;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 15px;
        background: var(--bg-input, #010409);
        border: 1px solid var(--border-color, #30363d);
        border-radius: 8px;
        color: white;
        font-family: inherit;
        font-size: 1rem;
        outline: none;
        transition: 0.2s;
        appearance: none;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--primary-color, #f59e0b);
      }
      .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--primary-color, #f59e0b);
        color: #000;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 15px;
      }
      .btn-submit:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }
      .switch-text {
        text-align: center;
        margin-top: 25px;
        color: var(--text-muted, #8b949e);
        font-size: 0.9rem;
      }
      .switch-text a {
        color: var(--primary-color, #f59e0b);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a
          href="index.html"
          class="logo"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: white;
            text-decoration: none;
          ">
          <img
            src="images/voxa-logo.png"
            alt="Voxa Logo"
            style="height: 35px; border-radius: 8px" />
          VOXA
        </a>
        <div class="nav-links">
          <a href="jobs.html">Find Jobs</a><a href="salaries.html">Salaries</a
          ><a href="companies.html">Companies</a>
        </div>
        <div class="nav-auth">
          <a href="login.html" class="btn-outline">Login</a>
        </div>
      </div>
    </nav>

    <div class="signup-wrapper">
      <div class="signup-card">
        <h2>Corporate Staff</h2>
        <p class="subtitle">
          Register your account. Requires manager approval.
        </p>

        <div
          id="messageBox"
          style="
            display: none;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
          "></div>

        <form id="staffSignupForm" onsubmit="handleStaffSignup(event)">
          <div class="form-group">
            <label>Requested Role</label>
            <select id="sRole" required onchange="updateFormVisibility()">
              <option value="UnitManager">Unit Manager</option>
              <option value="Leader">Team Leader</option>
              <option value="Recruiter" selected>Recruiter</option>
              <option value="Validator">Validator (QA)</option>
              <option value="HR">HR</option> </select>
            </select>
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              id="sName"
              placeholder="e.g. John Doe"
              required />
          </div>

          <div class="form-group">
            <label>Work Email</label>
            <input
              type="email"
              id="sEmail"
              placeholder="john@agency.com"
              required />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              id="sPassword"
              placeholder="Create a secure password"
              required />
          </div>

          <div class="form-group" id="groupAgency">
            <label>Agency Name</label>
            <select id="sAgency" required onchange="updateUnits()">
              <option value="" disabled selected>Loading Agencies...</option>
            </select>
          </div>

          <div class="form-group" id="groupUnit">
            <label>Unit Manager</label>
            <select id="sUnit" required onchange="updateTeams()">
              <option value="" disabled selected>Select Unit...</option>
            </select>
          </div>

          <div class="form-group" id="groupTeam">
            <label>Team Leader</label>
            <select id="sTeam" required>
              <option value="" disabled selected>Select Leader...</option>
            </select>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            Request Account Access
          </button>

          <p class="switch-text">
            Already approved? <a href="login.html">Sign in here</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      let dbStructure = {};

      // 1. On page load, get the existing Agencies, Units, and Teams
      window.onload = async function () {
        try {
          const res = await fetch(
            "https://voxa-pi-three.vercel.app/api/structure",
          );
          dbStructure = await res.json();

          const sAgency = document.getElementById("sAgency");
          sAgency.innerHTML =
            '<option value="" disabled selected>Select Agency...</option>';

          for (let agency in dbStructure) {
            let opt = document.createElement("option");
            opt.value = agency;
            opt.textContent = agency;
            sAgency.appendChild(opt);
          }
        } catch (e) {
          console.error("Failed to load structure.");
        }

        updateFormVisibility(); // Set the initial hiding/showing rules
      };

      // 2. Hide/Show fields dynamically based on the requested Role
      function updateFormVisibility() {
        const role = document.getElementById("sRole").value;
        const groupUnit = document.getElementById("groupUnit");
        const groupTeam = document.getElementById("groupTeam");
        const sUnit = document.getElementById("sUnit");
        const sTeam = document.getElementById("sTeam");

        if (role === "Validator" || role === "UnitManager" || role === "HR") {
          groupUnit.style.display = "none";
          sUnit.removeAttribute("required");
          groupTeam.style.display = "none";
          sTeam.removeAttribute("required");
        } else if (role === "Leader") {
          groupUnit.style.display = "block";
          sUnit.setAttribute("required", "true");
          groupTeam.style.display = "none";
          sTeam.removeAttribute("required");
        } else {
          // Recruiter
          groupUnit.style.display = "block";
          sUnit.setAttribute("required", "true");
          groupTeam.style.display = "block";
          sTeam.setAttribute("required", "true");
        }
      }

      // 3. Populate Unit dropdown based on the selected Agency
      function updateUnits() {
        const agency = document.getElementById("sAgency").value;
        const sUnit = document.getElementById("sUnit");
        sUnit.innerHTML =
          '<option value="" disabled selected>Select Unit...</option>';

        if (agency && dbStructure[agency]) {
          for (let unit in dbStructure[agency]) {
            if (unit && unit !== "null") {
              let opt = document.createElement("option");
              opt.value = unit;
              opt.textContent = unit;
              sUnit.appendChild(opt);
            }
          }
        }
        updateTeams();
      }

      // 4. Populate Team dropdown based on the selected Unit
      function updateTeams() {
        const agency = document.getElementById("sAgency").value;
        const unit = document.getElementById("sUnit").value;
        const sTeam = document.getElementById("sTeam");
        sTeam.innerHTML =
          '<option value="" disabled selected>Select Leader...</option>';

        if (
          agency &&
          unit &&
          dbStructure[agency] &&
          dbStructure[agency][unit]
        ) {
          dbStructure[agency][unit].forEach((team) => {
            if (team && team !== "null") {
              let opt = document.createElement("option");
              opt.value = team;
              opt.textContent = team;
              sTeam.appendChild(opt);
            }
          });
        }
      }

      // 5. Submit Form
      async function handleStaffSignup(e) {
        e.preventDefault();

        const btn = document.getElementById("submitBtn");
        const msgBox = document.getElementById("messageBox");
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
        btn.disabled = true;
        msgBox.style.display = "none";

        const role = document.getElementById("sRole").value;
        const fullName = document.getElementById("sName").value;

        // Auto-Naming Magic!
        let targetUnit = null;
        let targetTeam = null;

        if (role === "UnitManager") {
          targetUnit = fullName + " Unit";
        } else if (role === "Leader") {
          targetUnit = document.getElementById("sUnit").value;
          targetTeam = fullName + " Team";
        } else if (role === "Recruiter") {
          targetUnit = document.getElementById("sUnit").value;
          targetTeam = document.getElementById("sTeam").value;
        }

        const payload = {
          fullName: fullName,
          email: document.getElementById("sEmail").value,
          password: document.getElementById("sPassword").value,
          agency: document.getElementById("sAgency").value,
          role: role,
          unit: targetUnit,
          team: targetTeam,
        };

        try {
          const response = await fetch(
            "https://voxa-pi-three.vercel.app/api/staff-signup",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );
          const data = await response.json();

          msgBox.style.display = "block";
          if (response.ok) {
            msgBox.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
            msgBox.style.color = "#10b981";
            msgBox.style.border = "1px solid #10b981";
            msgBox.innerHTML = `✅ ${data.message}`;
            document.getElementById("staffSignupForm").reset();
            updateFormVisibility();
          } else {
            msgBox.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
            msgBox.style.color = "#ef4444";
            msgBox.style.border = "1px solid #ef4444";
            msgBox.innerHTML = `❌ ${data.error}`;
          }
        } catch (err) {
          msgBox.style.display = "block";
          msgBox.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
          msgBox.style.color = "#ef4444";
          msgBox.style.border = "1px solid #ef4444";
          msgBox.innerHTML = `❌ Failed to connect to server.`;
        } finally {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
