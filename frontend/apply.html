<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job | Dark Wolves</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Select Style for this page */
        select {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            appearance: none; /* Removes default arrow */
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a3a3a3%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 0.8rem auto;
        }
        select:focus { border-color: var(--primary-color); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Dark<span>Wolves</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html">Find Jobs</a></li>
                <li><a href="companies.html">Companies</a></li>
                <li><a href="salaries.html">Salaries</a></li>
            </ul>
            <div class="auth-buttons">
                </div>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="auth-container" style="min-height: calc(100vh - 200px); align-items: flex-start; padding-top: 4rem;">
        <div class="auth-box" style="max-width: 700px;">
            <div class="auth-header" style="text-align: left; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Job Application</h2>
                <p style="color: var(--primary-color); font-weight: 600; font-size: 1.1rem;" id="apply-job-title">Loading...</p>
                <p style="color: var(--text-muted); font-size: 0.9rem;" id="apply-company">...</p>
            </div>

            <form id="application-form">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Full Name <span style="color:var(--primary-color)">*</span></label>
                        <input type="text" id="app-name" required placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label>Email Address <span style="color:var(--primary-color)">*</span></label>
                        <input type="email" id="app-email" required placeholder="email@example.com">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label><i class="fas fa-phone-alt"></i> Phone (Calls) <span style="color:var(--primary-color)">*</span></label>
                        <input type="tel" id="app-phone" required placeholder="01xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label><i class="fab fa-whatsapp"></i> WhatsApp Number <span style="color:var(--primary-color)">*</span></label>
                        <input type="tel" id="app-whatsapp" required placeholder="01xxxxxxxxx">
                    </div>
                </div>

                <div class="form-group">
                    <label>English Level <span style="color:var(--primary-color)">*</span></label>
                    <select id="app-english" required>
                        <option value="" disabled selected>Select your level</option>
                        <option value="A1">A1 - Beginner</option>
                        <option value="A2">A2 - Elementary</option>
                        <option value="B1">B1 - Intermediate</option>
                        <option value="B2">B2 - Upper Intermediate</option>
                        <option value="C1">C1 - Advanced</option>
                        <option value="C2">C2 - Proficient / Native</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Relevant Experience <span style="color:var(--primary-color)">*</span></label>
                    <textarea id="app-experience" rows="5" required placeholder="Briefly describe your experience relevant to this role..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-secondary" onclick="window.history.back()" style="flex: 1;">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex: 2;">Submit Application</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Dark Wolves. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script>
        // Initialize Page Data
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const title = params.get('title');
            const company = params.get('company');

            if(title) document.getElementById('apply-job-title').textContent = title;
            if(company) document.getElementById('apply-company').textContent = company;

            // Pre-fill user data if logged in
            const userStr = localStorage.getItem('user');
            if(userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('app-name').value = user.name || '';
                document.getElementById('app-email').value = user.email || '';
            }
        });
    </script>
</body>
</html>
